<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIX3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#FCF2EC;
    --bg-b:#F6E4DE;
    --card:#FFFDFB;
    --line:rgba(80,52,58,0.10);
    --ink:#4A3038;
    --ink-soft:#8E7480;
    --ink-faint:#B9A6AE;
    --rose:#D98FA0;
    --rose-deep:#C06E82;
    --lav:#B9A3DE;
    --gold:#E3B873;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background:linear-gradient(180deg, var(--bg-a), var(--bg-b) 60%, var(--bg-a));
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  .glow{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .glow::before, .glow::after{
    content:"";
    position:absolute;
    width:60vw;
    height:60vw;
    max-width:820px;
    max-height:820px;
    border-radius:50%;
    filter:blur(100px);
    opacity:0.5;
  }
  .glow::before{
    background:radial-gradient(circle, var(--rose), transparent 70%);
    top:-18%;
    left:-12%;
    animation:driftA 24s ease-in-out infinite alternate;
  }
  .glow::after{
    background:radial-gradient(circle, var(--lav), transparent 70%);
    bottom:-22%;
    right:-14%;
    animation:driftB 28s ease-in-out infinite alternate;
  }
  @keyframes driftA{ to{ transform:translate(5vw,6vh) scale(1.1); } }
  @keyframes driftB{ to{ transform:translate(-4vw,-5vh) scale(1.06); } }

  .petals{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-8vh;
    width:14px;
    height:18px;
    background:linear-gradient(160deg, var(--rose), var(--gold) 120%);
    border-radius:70% 20% 70% 20%;
    opacity:0.55;
    animation-name:fall, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes fall{
    to{ transform:translateY(118vh) rotate(240deg); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0; }
    50%{ margin-left:40px; }
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:720px;
    margin:0 auto;
    padding:9vh 24px 10vh;
  }

  header{
    text-align:center;
    margin-bottom:56px;
  }
  .eyebrow{
    display:inline-block;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 10px;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(52px, 14vw, 118px);
    line-height:0.95;
    letter-spacing:-0.01em;
    margin:0;
    opacity:0;
    filter:blur(8px);
    animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) forwards;
    background:linear-gradient(100deg, var(--rose-deep), var(--rose) 45%, var(--lav) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  @keyframes reveal{ to{ opacity:1; filter:blur(0); } }
  .tagline{
    margin:16px auto 0;
    max-width:36ch;
    color:var(--ink-soft);
    font-size:16px;
    line-height:1.65;
  }

  .card{
    margin-top:12px;
    background:rgba(255,253,251,0.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:28px;
    padding:32px clamp(20px,4vw,40px) 8px;
    box-shadow:0 30px 60px -30px rgba(120,70,85,0.35);
  }

  .now-playing{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
  }
  .np-label{
    font-size:12px;
    color:var(--ink-faint);
    margin:0 0 6px;
  }
  .np-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:clamp(20px,4vw,27px);
    font-weight:500;
    margin:0;
    color:var(--ink);
  }

  .viz{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:30px;
  }
  .viz span{
    display:block;
    width:3px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--rose), var(--lav));
    height:4px;
    transition:height 0.09s ease;
  }

  .scrub-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .time{
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--ink-faint);
    width:36px;
  }
  .time.end{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:3px;
    background:var(--line);
    border-radius:3px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--rose-deep);
    cursor:pointer;
    box-shadow:0 0 0 5px rgba(192,110,130,0.14);
    transition:box-shadow 0.15s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb{
    box-shadow:0 0 0 7px rgba(192,110,130,0.18);
  }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border:none; border-radius:50%;
    background:var(--rose-deep); cursor:pointer;
  }
  #seek{
    background:linear-gradient(to right, var(--rose) var(--pct,0%), var(--line) var(--pct,0%));
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    padding-bottom:26px;
    gap:18px;
    flex-wrap:wrap;
  }
  .transport{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .transport button{
    background:none;
    border:none;
    padding:0;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .transport button:focus-visible, .track:focus-visible, input:focus-visible{
    outline:2px solid var(--rose-deep);
    outline-offset:3px;
  }
  .mini{ opacity:0.55; transition:opacity 0.15s ease; color:var(--ink-soft); }
  .mini:hover{ opacity:1; }
  .mini svg{ width:16px; height:16px; }

  #playBtn{
    width:54px; height:54px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 26px -10px rgba(192,110,130,0.6);
    transition:transform 0.15s ease;
  }
  #playBtn:hover{ transform:scale(1.05); }
  #playBtn svg{ width:18px; height:18px; }

  .tracklist{
    margin-top:44px;
    border-top:1px solid var(--line);
  }
  .track{
    width:100%;
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px 6px;
    border-bottom:1px solid var(--line);
    background:none;
    border-left:none;
    border-right:none;
    border-top:none;
    text-align:left;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    border-radius:14px;
    transition:background 0.2s ease;
  }
  .track:hover{ background:rgba(217,143,160,0.08); }
  .track:hover .t-title{ color:var(--rose-deep); }
  .track .t-index{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:14px;
    color:var(--ink-faint);
    width:20px;
  }
  .track .t-body{ flex:1; min-width:0; }
  .t-title{
    font-size:17px;
    font-weight:500;
    transition:color 0.15s ease;
    display:block;
  }
  .t-sub{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .t-time{
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--ink-faint);
  }
  .t-pulse{
    width:14px; height:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .t-pulse span{
    width:2.5px;
    background:var(--gold);
    border-radius:1px;
    height:4px;
    display:none;
  }
  .track.active{ background:rgba(217,143,160,0.09); }
  .track.active .t-title{ color:var(--rose-deep); }
  .track.active .t-index{ color:var(--rose-deep); }
  .track.active .t-pulse span{ display:block; animation:pulse 0.9s ease-in-out infinite; }
  .track.active .t-pulse span:nth-child(2){ animation-delay:0.15s; }
  .track.active .t-pulse span:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{ 0%,100%{ height:4px; } 50%{ height:13px; } }
  .track:not(.playing) .t-pulse span{ animation-play-state:paused; height:4px; }

  footer{
    margin-top:64px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--ink-faint);
    font-size:12px;
    border-top:1px solid var(--line);
    padding-top:20px;
  }

  @media (max-width:640px){
    .wrap{ padding:7vh 16px 8vh; }
    .card{ padding:26px 18px 6px; border-radius:22px; }
    .now-playing{ flex-direction:column; align-items:flex-start; gap:12px; }
    .viz{ align-self:flex-start; }
    .controls{ justify-content:center; }
  }
  @media (max-width:380px){
    .transport{ gap:14px; }
    .track{ gap:12px; padding:16px 4px; }
    .t-sub{ display:none; }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="petals" id="petals"></div>

<div class="wrap">

  <header>
    <p class="eyebrow">A little something, on repeat</p>
    <h1 class="wordmark">Trix3</h1>
    <p class="tagline">Originally made for you</p>
  </header>

  <section class="card">
    <div class="now-playing">
      <div>
        <p class="np-label">Now playing</p>
        <h2 class="np-title" id="npTitle">Unfaded</h2>
      </div>
      <div class="viz" id="viz" aria-hidden="true"></div>
    </div>

    <div class="scrub-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
      <span class="time end" id="durTime">0:00</span>
    </div>

    <div class="controls">
      <div class="transport">
        <button class="mini" id="prevBtn" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM10 12l9-7v14z"/></svg>
        </button>
        <button id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="mini" id="nextBtn" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5l9 7-9 7z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="tracklist" id="tracklist" aria-label="Track list"></section>

  <footer>
    <span>Writer — Astra</span>
    <span id="trackCount">3 tracks</span>
  </footer>

</div>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
const tracks = [
  { title: "Unfaded", sub: "Original", src: "https://ik.imagekit.io/jssrll10/Trix3/Unfaded.mp3" },
  { title: "Your Name", sub: "Original", src: "https://ik.imagekit.io/jssrll10/Trix3/Your%20Name.mp3" },
  { title: "Your Name Remastered", sub: "Remastered", src: "https://ik.imagekit.io/jssrll10/Trix3/Your%20Name%20Remastered.mp3" },
];

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const npTitle = document.getElementById('npTitle');
const tracklistEl = document.getElementById('tracklist');
const vizEl = document.getElementById('viz');
const petalsEl = document.getElementById('petals');

let current = 0;
let isSeeking = false;
let audioCtx = null;
let analyser = null;
let dataArray = null;
let sourceNode = null;
let usingRealAnalyser = false;
let rafId = null;

const PETAL_COUNT = 12;
for (let i = 0; i < PETAL_COUNT; i++) {
  const p = document.createElement('span');
  p.className = 'petal';
  const left = Math.random() * 100;
  const fallDur = 14 + Math.random() * 10;
  const swayDur = 3 + Math.random() * 2;
  const delay = Math.random() * -20;
  const size = 10 + Math.random() * 8;
  const hue = Math.random() > 0.5 ? 'var(--rose)' : 'var(--lav)';
  p.style.left = left + 'vw';
  p.style.width = size + 'px';
  p.style.height = (size * 1.3) + 'px';
  p.style.background = `linear-gradient(160deg, ${hue}, var(--gold) 120%)`;
  p.style.animationDuration = `${fallDur}s, ${swayDur}s`;
  p.style.animationDelay = `${delay}s, ${delay}s`;
  petalsEl.appendChild(p);
}

tracks.forEach((t, i) => {
  const row = document.createElement('button');
  row.className = 'track';
  row.setAttribute('data-index', i);
  row.innerHTML = `
    <span class="t-index">${String(i + 1).padStart(2, '0')}</span>
    <span class="t-body">
      <span class="t-title">${t.title}</span>
      <span class="t-sub">${t.sub}</span>
    </span>
    <span class="t-pulse"><span></span><span></span><span></span></span>
    <span class="t-time" data-dur>--:--</span>
  `;
  row.addEventListener('click', () => loadTrack(i, true));
  tracklistEl.appendChild(row);
});

const BAR_COUNT = 26;
const bars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('span');
  vizEl.appendChild(b);
  bars.push(b);
}

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setActiveRow() {
  document.querySelectorAll('.track').forEach((row, i) => {
    row.classList.toggle('active', i === current);
    row.classList.toggle('playing', i === current && !audio.paused);
  });
}

function loadTrack(index, autoplay) {
  current = (index + tracks.length) % tracks.length;
  const t = tracks[current];
  audio.src = t.src;
  npTitle.textContent = t.title + (t.sub === 'Remastered' ? ' (Remastered)' : '');
  setActiveRow();
  seek.value = 0;
  seek.style.setProperty('--pct', '0%');
  curTime.textContent = '0:00';
  if (autoplay) {
    audio.play().catch(() => {});
  }
}

function togglePlay() {
  if (audio.paused) {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        audio.play().catch(() => {});
      }).catch(() => {
        audio.play().catch(() => {});
      });
    } else {
      audio.play().catch(() => {});
    }
  } else {
    audio.pause();
  }
}

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', () => loadTrack(current - 1, true));
nextBtn.addEventListener('click', () => loadTrack(current + 1, true));

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = '';
  setActiveRow();
  ensureAnalyser();
});
audio.addEventListener('pause', () => {
  playIcon.style.display = '';
  pauseIcon.style.display = 'none';
  setActiveRow();
});
audio.addEventListener('ended', () => loadTrack(current + 1, true));

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmt(audio.duration);
  const row = tracklistEl.querySelector(`.track[data-index="${current}"] [data-dur]`);
  if (row) row.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  seek.value = pct;
  seek.style.setProperty('--pct', pct + '%');
  curTime.textContent = fmt(audio.currentTime);
});

seek.addEventListener('input', () => {
  isSeeking = true;
  seek.style.setProperty('--pct', seek.value + '%');
  if (audio.duration) curTime.textContent = fmt((seek.value / 100) * audio.duration);
});
seek.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
  isSeeking = false;
});

tracks.forEach((t, i) => {
  if (i === current) return;
  const probe = new Audio();
  probe.preload = 'metadata';
  probe.src = t.src;
  probe.addEventListener('loadedmetadata', () => {
    const cell = tracklistEl.querySelector(`.track[data-index="${i}"] [data-dur]`);
    if (cell) cell.textContent = fmt(probe.duration);
  });
});

function ensureAnalyser() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    usingRealAnalyser = true;
  } catch (e) {
    usingRealAnalyser = false;
  }
  if (!rafId) animateViz();
}

function animateViz() {
  rafId = requestAnimationFrame(animateViz);
  if (audio.paused) {
    bars.forEach(b => b.style.height = '4px');
    return;
  }
  if (usingRealAnalyser && analyser) {
    analyser.getByteFrequencyData(dataArray);
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = dataArray[i % dataArray.length] / 255;
      bars[i].style.height = `${4 + v * 28}px`;
    }
  } else {
    const t = performance.now() / 1000;
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = (Math.sin(t * 4 + i * 0.6) + 1) / 2;
      bars[i].style.height = `${4 + v * 24}px`;
    }
  }
}

loadTrack(0, false);

document.addEventListener('click', function resumeCtx() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
});
</script>
</body>
</html>
